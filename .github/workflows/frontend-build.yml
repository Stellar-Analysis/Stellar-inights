name: Frontend Build

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Measure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        continue-on-error: true
        run: pnpm exec tsc --noEmit

      - name: Build (timed)
        id: build
        run: |
          START=$(date +%s%3N)
          pnpm build
          END=$(date +%s%3N)
          MS=$((END - START))
          MINS=$((MS / 60000))
          SECS=$(awk "BEGIN { printf \"%.1f\", ($MS % 60000) / 1000 }")
          echo "build_ms=${MS}" >> "$GITHUB_OUTPUT"
          echo "build_time=${MINS}m ${SECS}s" >> "$GITHUB_OUTPUT"

      - name: Build metrics summary
        if: always()
        env:
          BUILD_MS: ${{ steps.build.outputs.build_ms }}
          BUILD_TIME: ${{ steps.build.outputs.build_time }}
        run: |
          STATUS="Under target"
          if [ -n "$BUILD_MS" ] && [ "$BUILD_MS" -gt 120000 ]; then
            STATUS="Over 2-minute target"
          fi
          {
            echo "## Frontend Build Metrics"
            echo
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Build time** | \`${BUILD_TIME:-unavailable}\` |"
            echo "| **Target** | \`< 2 minutes\` |"
            echo "| **Status** | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn if build exceeds target
        if: ${{ steps.build.outputs.build_ms != '' && steps.build.outputs.build_ms > 120000 }}
        run: echo "::warning::Build took ${{ steps.build.outputs.build_time }}, exceeding the 2-minute target."

      - name: Upload Next.js build output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-output
          path: frontend/.next
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-logs
          path: |
            frontend/.next/trace
            frontend/npm-debug.log*
            frontend/pnpm-debug.log*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "Frontend validation completed with status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
